[project]
name = "promptmend"
version = "0.25.0"
description = "PromptMend: Espanso triggers that rewrite rough drafts into precise LLM prompts (OpenRouter, Anthropic, Ollama, LM Studio)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vlastimil Bures" }]
keywords = [
  "espanso",
  "prompt",
  "prompt-engineering",
  "llm",
  "openrouter",
  "anthropic",
  "ollama",
  "lm-studio",
  "text-expansion",
  "cli",
  "tui",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.27,<1",
  "pyperclip>=1.9,<2",
  # The full-screen interface (`promptmend` on a terminal, `ui`); imported only there.
  "textual>=8.2.8,<9",
  # Writes config.toml and secrets.toml; imported only when saving, never by a trigger.
  "tomli-w>=1.2,<2",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/vlastimilbures/promptmend"
Documentation = "https://github.com/vlastimilbures/promptmend/tree/main/docs"
Source = "https://github.com/vlastimilbures/promptmend"
Issues = "https://github.com/vlastimilbures/promptmend/issues"
Changelog = "https://github.com/vlastimilbures/promptmend/blob/main/CHANGELOG.md"

[project.scripts]
promptmend = "promptmend.entry:main"
# Deprecated alias until 1.0.0 (#169): management commands print a note on stderr.
prompt-workflow = "promptmend.entry:main"

# Development tools: `uv sync` installs this group; `uv tool install` never does.
[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16.9,<0.17",
  "mypy>=2.3,<3",
  "pre-commit>=4.6,<5",
  "PyYAML>=6.0,<7",
]
# The frozen Windows build (#185, packaging/windows/): `uv sync --group build`. Never in the
# runtime dependencies, constraints.txt or the Homebrew formula.
build = [
  "pyinstaller==6.22.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# The exact build backend for `uv build`, so a release wheel does not depend on whichever
# hatchling is newest on the day. Bump it by hand to a release at least a week old.
build-constraint-dependencies = ["hatchling==1.32.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/promptmend"]

# The Espanso match files ship in the wheel (read by promptmend.assets); espanso/ in the
# repo stays their source. espanso/config/ is deliberately not shipped.
[tool.hatch.build.targets.wheel.force-include]
"espanso/match" = "promptmend/espanso/match"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "PT", "C4", "PIE", "RET", "PERF", "FURB"]

[tool.ruff.lint.per-file-ignores]
# _env() returns a dataclasses.field(default_factory=...), not a shared default value.
"src/promptmend/config.py" = ["RUF009"]
# Tests assert, and run the CLI in a subprocess the way Espanso does.
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests", "packaging"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = ["live: calls the real OpenRouter API (opt-in: pytest -m live)"]

[tool.coverage.run]
branch = true
source = ["promptmend"]

[tool.coverage.report]
fail_under = 95
show_missing = true
