# Actions and pre-commit hooks are pinned to commit SHAs; Dependabot keeps those pins and
# uv.lock current. The cooldown skips releases younger than a week, the window in which a
# hijacked package is usually caught and yanked; security updates are not delayed by it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # hatchling is bumped by hand in both `build-system.requires` and `[tool.uv]
    # build-constraint-dependencies` (see the note in pyproject.toml); Dependabot can raise
    # only the first, and the pin then fails `uv sync --locked`.
    ignore:
      - dependency-name: hatchling
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
