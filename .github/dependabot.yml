# Actions and pre-commit hooks are pinned to commit SHAs; Dependabot keeps those pins and
# uv.lock current. The cooldown skips releases younger than a week, the window in which a
# hijacked package is usually caught and yanked; security updates are not delayed by it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # hatchling's `[tool.uv] build-constraint-dependencies` pin is bumped by hand (CONTRIBUTING
    # "Releasing"); Dependabot can raise only `build-system.requires`, and the pin then fails
    # `uv sync --locked`. So no Dependabot security PRs for hatchling either: it is build-only,
    # watch its releases by hand.
    ignore:
      - dependency-name: hatchling
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
