name: test
on:
  # PR branches are covered by pull_request; push only for main avoids double runs.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Platform-independent checks run once. pre-commit covers ruff, ruff-format, YAML
  # validity, whitespace and gitleaks.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Pre-commit
        run: uv run pre-commit run --all-files
      - name: Type check
        run: uv run mypy

  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # Coverage settings, including the fail_under floor, live in pyproject.toml.
      - name: Test
        run: uv run pytest --cov

  # What the built wheel really contains: pyproject.toml declaring package data proves nothing.
  # The wheel (built from the sdist) goes into a clean venv outside the checkout, so neither
  # src/ nor espanso/ in the repo can stand in for a missing file.
  wheel:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Install the wheel into a clean venv and check it
        working-directory: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE/dist/*.whl" | Select-Object -First 1).FullName
          $venv = Join-Path $env:RUNNER_TEMP "wheel-venv"
          uv venv $venv
          uv pip install --python $venv $wheel
          $python = if ($IsWindows) { "$venv/Scripts/python.exe" } else { "$venv/bin/python" }
          & $python "$env:GITHUB_WORKSPACE/scripts/check_wheel.py" --repo $env:GITHUB_WORKSPACE --wheel $wheel

  # The Windows user installer (#186), run as the one-liner runs it (Windows PowerShell 5.1,
  # `irm | iex`). A rendered copy is dry-run to check the Release URLs it would install from;
  # the installs use the wheel and constraints.txt built here through the local override, so
  # promptmend never comes from PyPI. The first install runs with uv hidden from PATH, so the
  # script installs uv itself (winget, else uv's installer); the second, with uv, must
  # reinstall in place. It never deploys.
  install-script:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # install.ps1's closing doctor must not ask pypi.org for a newer release (#197).
      PROMPT_UPDATE_CHECK: "false"
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build the wheel and constraints.txt
        run: |
          uv build --wheel --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file dist/constraints.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Native stderr must not stop these steps (Windows PowerShell 5.1): every exit code is
      # checked by hand.
      - name: Dry-run a rendered copy and check what it would install
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl" | Select-Object -First 1
          $version = $wheel.Name.Split('-')[1]
          $rendered = "$env:RUNNER_TEMP\install.ps1"
          uv run --no-project python "$env:GITHUB_WORKSPACE\scripts\render_installer.py" $version $rendered
          if ($LASTEXITCODE -ne 0) { throw "render_installer exited $LASTEXITCODE" }
          $env:PROMPTMEND_DRY_RUN = '1'
          $out = powershell -NoProfile -ExecutionPolicy ByPass -Command "Get-Content -Raw '$rendered' | Invoke-Expression" | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dry run exited $LASTEXITCODE`n$out" }
          Write-Host $out
          $download = "https://github.com/vlastimilbures/promptmend/releases/download/v$version"
          $want = "> uv tool install --force --compile-bytecode $download/promptmend-$version-py3-none-any.whl -c $download/constraints.txt"
          if (-not $out.Contains($want)) { throw "the dry run did not print: $want" }
          $env:PROMPTMEND_VERSION = '0.18.0'
          $out = powershell -NoProfile -ExecutionPolicy ByPass -Command "Get-Content -Raw '$rendered' | Invoke-Expression" | Out-String
          if ($LASTEXITCODE -eq 0) { throw "0.18.0 was not refused`n$out" }
          exit 0
      - name: Install without uv on PATH (the script installs uv)
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl" | Select-Object -First 1
          $env:PROMPTMEND_WHEEL = $wheel.FullName
          $env:PROMPTMEND_CONSTRAINTS = "$env:GITHUB_WORKSPACE\dist\constraints.txt"
          $env:UV_INSTALL_DIR = "$env:RUNNER_TEMP\uv-bin"
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'uv.exe')) }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw "uv is still on PATH" }
          $script = "$env:GITHUB_WORKSPACE\scripts\install.ps1"
          $log = "$env:RUNNER_TEMP\no-uv.log"
          powershell -NoProfile -ExecutionPolicy ByPass -Command "Get-Content -Raw '$script' | Invoke-Expression" | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 without uv exited $LASTEXITCODE" }
          if (-not (Select-String -Path $log -SimpleMatch 'uv was not found: installing it' -Quiet)) {
            throw "install.ps1 found a uv on PATH; the install-uv branch did not run"
          }
          exit 0
      - name: Run install.ps1 again with uv and check the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl" | Select-Object -First 1
          $env:PROMPTMEND_WHEEL = $wheel.FullName
          $env:PROMPTMEND_CONSTRAINTS = "$env:GITHUB_WORKSPACE\dist\constraints.txt"
          $script = "$env:GITHUB_WORKSPACE\scripts\install.ps1"
          powershell -NoProfile -ExecutionPolicy ByPass -Command "Get-Content -Raw '$script' | Invoke-Expression"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 rerun exited $LASTEXITCODE" }
          $bin = (uv tool dir --bin).Trim()
          $installed = (& "$bin\promptmend.exe" --version).Trim()
          $expected = $wheel.Name.Split('-')[1]
          if ($installed -ne $expected) { throw "installed $installed, expected $expected" }
          Write-Host "promptmend $installed from $bin"

  # The frozen Windows build (#185): PyInstaller onedir, zipped as the release does it, then
  # unzipped and run as a user would, with no Python or uv involved: --version, doctor (which
  # must see a frozen build), persona, the same exe reached through a symbolic link in a fake
  # WinGet layout (doctor must report the winget channel and the Links alias), every
  # trigger's real args against the setup check's local stub (exit 0, empty stderr), and the
  # trigger latency in the job summary. The zip is kept as an artifact for a few days.
  frozen-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # No request to pypi.org from doctor (#197).
      PROMPT_UPDATE_CHECK: "false"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build the zip
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --locked --group build
          uv run --group build python scripts/build_windows.py build
      - name: Unzip it and run the exe
        working-directory: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\promptmend-*-windows-x64.zip" | Select-Object -First 1
          $version = $zip.Name.Split('-')[1]
          # A fixed place, as docs/install.md says: deploy refuses a temp or versioned folder.
          $root = "$env:LOCALAPPDATA\Programs\promptmend-ci"
          Expand-Archive $zip.FullName -DestinationPath $root
          $exe = "$root\promptmend\promptmend.exe"
          foreach ($data in "_internal", "_internal\promptmend\espanso\match\prompts-llm.yml", "_internal\promptmend\prompts\default.md") {
            if (-not (Test-Path "$root\promptmend\$data")) { throw "the zip lacks $data" }
          }
          $installed = (& $exe --version).Trim()
          if ($installed -ne $version) { throw "the exe says $installed, the zip is $version" }
          $persona = & $exe persona 2> "$env:RUNNER_TEMP\persona-stderr.txt"
          if ((Get-Item "$env:RUNNER_TEMP\persona-stderr.txt").Length -ne 0) { throw "persona wrote to stderr" }
          if ($persona -ne "I am working as [role] in [company].") { throw "persona printed: $persona" }
          # doctor exits 4 here (no key, no Espanso); only its report matters.
          $PSNativeCommandUseErrorActionPreference = $false
          $report = (& $exe doctor --no-clipboard --json) | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -notin 0, 4) { throw "doctor exited $LASTEXITCODE" }
          $report.checks.cli | ConvertTo-Json -Depth 5
          $report.checks.install | ConvertTo-Json -Depth 5
          if ($report.checks.cli.data.frozen -ne $true) { throw "doctor does not see a frozen build" }
          if ($report.checks.version.data.version -ne $version) { throw "doctor reports another version" }
          if ($report.checks.install.data.channel -ne "script") { throw "an unzipped exe is not the script channel" }
          "FROZEN_EXE=$exe" >> $env:GITHUB_ENV
          exit 0  # not doctor's 4
      - name: Run it through a WinGet Links alias
        working-directory: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $local = "$env:RUNNER_TEMP\winget-local"
          $package = "$local\Microsoft\WinGet\Packages\vlastimilbures.PromptMend_Microsoft.Winget.Source_8wekyb3d8bbwe"
          New-Item -ItemType Directory -Force -Path $package, "$local\Microsoft\WinGet\Links" | Out-Null
          Copy-Item -Recurse "$env:LOCALAPPDATA\Programs\promptmend-ci\promptmend" $package
          $link = "$local\Microsoft\WinGet\Links\promptmend.exe"
          New-Item -ItemType SymbolicLink -Path $link -Target "$package\promptmend\promptmend.exe" | Out-Null
          & $link --version
          $env:LOCALAPPDATA = $local
          $PSNativeCommandUseErrorActionPreference = $false
          $report = (& $link doctor --no-clipboard --json) | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -notin 0, 4) { throw "doctor exited $LASTEXITCODE" }
          $report.checks.cli | ConvertTo-Json -Depth 5
          $report.checks.install | ConvertTo-Json -Depth 5
          if ($report.checks.install.data.channel -ne "winget") { throw "doctor does not see the winget channel" }
          if ($report.checks.install.data.launcher -ne $link) { throw "the launcher is not the Links alias" }
          exit 0  # not doctor's 4
      - name: Replay every trigger through the exe
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PROMPTMEND_EXE = $env:FROZEN_EXE
          uv run pytest tests/test_triggers.py -k process -p no:cacheprovider
      - name: Time a trigger
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv run python scripts/build_windows.py time $env:FROZEN_EXE
      # The manifests a release would submit to microsoft/winget-pkgs (by hand, #185),
      # rendered for this zip and checked by the runner's own winget.
      - name: Validate the WinGet manifests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw "this runner has no winget" }
          winget --version
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\promptmend-*-windows-x64.zip" | Select-Object -First 1
          $version = $zip.Name.Split('-')[1]
          uv run python scripts/winget_manifest.py --version $version --zip $zip.FullName -o "$env:RUNNER_TEMP\winget"
          winget validate --manifest "$env:RUNNER_TEMP\winget\manifests\v\vlastimilbures\PromptMend\$version" --disable-interactivity
      # The same manifests, the installer URL pointing at this zip on a loopback server.
      - name: Install, run and uninstall it with winget
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\promptmend-*-windows-x64.zip" | Select-Object -First 1
          $version = $zip.Name.Split('-')[1]
          $port = 8765
          $server = $null
          try {
            $server = Start-Process -PassThru -NoNewWindow -FilePath "$env:GITHUB_WORKSPACE\.venv\Scripts\python.exe" -ArgumentList "-m", "http.server", "$port", "--bind", "127.0.0.1", "--directory", "$env:GITHUB_WORKSPACE\dist"
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (Test-NetConnection 127.0.0.1 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue)) {
              if ((Get-Date) -gt $deadline) { throw "the local server did not start" }
              Start-Sleep -Milliseconds 500
            }
            $out = "$env:RUNNER_TEMP\winget-local-install"
            uv run python scripts/winget_manifest.py --version $version --zip $zip.FullName -o $out --url "http://127.0.0.1:$port/$($zip.Name)"
            $manifest = "$out\manifests\v\vlastimilbures\PromptMend\$version"
            winget settings --enable LocalManifestFiles
            winget settings --enable LocalArchiveMalwareScanOverride
            winget install --manifest $manifest --accept-package-agreements --accept-source-agreements --disable-interactivity --ignore-local-archive-malware-scan
          } finally {
            if ($server) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
          $link = "$env:LOCALAPPDATA\Microsoft\WinGet\Links\promptmend.exe"
          if (-not (Test-Path $link)) { throw "winget made no Links alias" }
          $installed = (& $link --version).Trim()
          if ($installed -ne $version) { throw "the alias says $installed, the zip is $version" }
          $PSNativeCommandUseErrorActionPreference = $false
          $report = (& $link doctor --no-clipboard --json) | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -notin 0, 4) { throw "doctor exited $LASTEXITCODE" }
          $report.checks.install | ConvertTo-Json -Depth 5
          if ($report.checks.install.data.channel -ne "winget") { throw "doctor does not see the winget channel" }
          if ($report.checks.install.data.launcher -ne $link) { throw "the launcher is not the Links alias" }
          $PSNativeCommandUseErrorActionPreference = $true
          winget uninstall --manifest $manifest --accept-source-agreements --disable-interactivity
          if (Test-Path $link) { throw "the Links alias is still there" }
          $left = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter "vlastimilbures.PromptMend_*" -ErrorAction SilentlyContinue
          if ($left) { throw "winget left $($left.FullName)" }
      - name: Keep the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: promptmend-windows-x64
          path: dist/promptmend-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
