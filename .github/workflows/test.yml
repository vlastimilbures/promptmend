name: test
on:
  # PR branches are covered by pull_request; push only for main avoids double runs.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Platform-independent checks run once. pre-commit covers ruff, ruff-format, YAML
  # validity, whitespace and gitleaks.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Pre-commit
        run: uv run pre-commit run --all-files
      - name: Type check
        run: uv run mypy

  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # Coverage settings, including the fail_under floor, live in pyproject.toml.
      - name: Test
        run: uv run pytest --cov

  # What the built wheel really contains: pyproject.toml declaring package data proves nothing.
  # The wheel (built from the sdist) goes into a clean venv outside the checkout, so neither
  # src/ nor espanso/ in the repo can stand in for a missing file.
  wheel:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Install the wheel into a clean venv and check it
        working-directory: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE/dist/*.whl" | Select-Object -First 1).FullName
          $venv = Join-Path $env:RUNNER_TEMP "wheel-venv"
          uv venv $venv
          uv pip install --python $venv $wheel
          $python = if ($IsWindows) { "$venv/Scripts/python.exe" } else { "$venv/bin/python" }
          & $python "$env:GITHUB_WORKSPACE/scripts/check_wheel.py" --repo $env:GITHUB_WORKSPACE --wheel $wheel

  # The Windows user installer (#186), run as the one-liner runs it (Windows PowerShell 5.1,
  # `irm | iex`). A rendered copy is dry-run on both channels to check the Release URLs and
  # the zip hash it would install with, and the refusals; the uv channel's installs use the
  # wheel and constraints.txt built here through the local override, so promptmend never comes
  # from PyPI (frozen-windows installs the exe channel from its own zip). The first install
  # runs with uv hidden from PATH, so the script installs uv itself (winget, else uv's
  # installer); the second, with uv, must reinstall in place; then `doctor --timing` through
  # uv's shim goes to the job summary. It never deploys.
  install-script:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # install.ps1's closing doctor must not ask pypi.org for a newer release (#197).
      PROMPT_UPDATE_CHECK: "false"
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build the wheel and constraints.txt
        run: |
          uv build --wheel --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file dist/constraints.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Native stderr must not stop these steps (Windows PowerShell 5.1): every exit code is
      # checked by hand.
      # Both channels: exe (the default; a stand-in file gives the rendered copy a known zip
      # hash, since this job builds no zip: frozen-windows installs a real one) and uv.
      - name: Dry-run a rendered copy and check what it would install
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl" | Select-Object -First 1
          $version = $wheel.Name.Split('-')[1]
          $standin = "$env:RUNNER_TEMP\stand-in.zip"
          [IO.File]::WriteAllText($standin, 'a stand-in for the Windows zip')
          $hash = (Get-FileHash -LiteralPath $standin -Algorithm SHA256).Hash.ToLowerInvariant()
          $rendered = "$env:RUNNER_TEMP\install.ps1"
          uv run --no-project python "$env:GITHUB_WORKSPACE\scripts\render_installer.py" $version $rendered --zip $standin
          if ($LASTEXITCODE -ne 0) { throw "render_installer exited $LASTEXITCODE" }
          # stdout, ending in the message of the error a refusal throws, written on one line to
          # stdout (an error record would wrap at the console width and go to stderr).
          function Invoke-Rendered {
            powershell -NoProfile -ExecutionPolicy ByPass -Command "try { Get-Content -Raw '$rendered' | Invoke-Expression } catch { [Console]::Out.WriteLine(`$_.Exception.Message); exit 1 }" | Out-String
          }
          function Has-Text([string]$Out, [string]$Text) {
            return $Out.Contains($Text)
          }
          $env:PROMPTMEND_DRY_RUN = '1'
          $download = "https://github.com/vlastimilbures/promptmend/releases/download/v$version"
          # exe, the default
          $out = Invoke-Rendered
          if ($LASTEXITCODE -ne 0) { throw "exe dry run exited $LASTEXITCODE`n$out" }
          Write-Host $out
          $dest = "$env:LOCALAPPDATA\Programs\promptmend"
          foreach ($want in "Channel: exe", "> Invoke-WebRequest -UseBasicParsing -Uri $download/promptmend-$version-windows-x64.zip -OutFile", "which must have the SHA-256 $hash", "into $dest", "> $dest\promptmend.exe doctor --no-clipboard") {
            if (-not $out.Contains($want)) { throw "the exe dry run did not print: $want" }
          }
          if (Test-Path $dest) { throw "the dry run created $dest" }
          # uv
          $env:PROMPTMEND_CHANNEL = 'uv'
          $out = Invoke-Rendered
          if ($LASTEXITCODE -ne 0) { throw "uv dry run exited $LASTEXITCODE`n$out" }
          Write-Host $out
          $want = "> uv tool install --force --compile-bytecode $download/promptmend-$version-py3-none-any.whl -c $download/constraints.txt"
          if (-not $out.Contains($want)) { throw "the dry run did not print: $want" }
          $env:PROMPTMEND_VERSION = '0.18.0'
          $out = Invoke-Rendered
          if ($LASTEXITCODE -eq 0) { throw "0.18.0 was not refused`n$out" }
          Remove-Item Env:PROMPTMEND_VERSION
          # Refused: an unknown channel, another release's zip, a wheel on the exe channel.
          $env:PROMPTMEND_CHANNEL = 'pip'
          $out = Invoke-Rendered
          if ($LASTEXITCODE -eq 0 -or -not (Has-Text $out 'is not exe or uv')) { throw "PROMPTMEND_CHANNEL=pip was not refused`n$out" }
          Remove-Item Env:PROMPTMEND_CHANNEL
          $env:PROMPTMEND_VERSION = '0.19.0'
          $out = Invoke-Rendered
          if ($LASTEXITCODE -eq 0 -or -not (Has-Text $out "checks the zip of PromptMend $version only")) { throw "another release's zip was not refused`n$out" }
          Remove-Item Env:PROMPTMEND_VERSION
          $env:PROMPTMEND_CHANNEL = 'exe'
          $env:PROMPTMEND_WHEEL = $wheel.FullName
          $out = Invoke-Rendered
          if ($LASTEXITCODE -eq 0) { throw "PROMPTMEND_WHEEL on the exe channel was not refused`n$out" }
          exit 0
      - name: Install without uv on PATH (the script installs uv)
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl" | Select-Object -First 1
          $env:PROMPTMEND_WHEEL = $wheel.FullName
          $env:PROMPTMEND_CONSTRAINTS = "$env:GITHUB_WORKSPACE\dist\constraints.txt"
          $env:UV_INSTALL_DIR = "$env:RUNNER_TEMP\uv-bin"
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'uv.exe')) }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw "uv is still on PATH" }
          $script = "$env:GITHUB_WORKSPACE\scripts\install.ps1"
          $log = "$env:RUNNER_TEMP\no-uv.log"
          powershell -NoProfile -ExecutionPolicy ByPass -Command "Get-Content -Raw '$script' | Invoke-Expression" | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 without uv exited $LASTEXITCODE" }
          if (-not (Select-String -Path $log -SimpleMatch 'uv was not found: installing it' -Quiet)) {
            throw "install.ps1 found a uv on PATH; the install-uv branch did not run"
          }
          exit 0
      - name: Run install.ps1 again with uv and check the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl" | Select-Object -First 1
          $env:PROMPTMEND_WHEEL = $wheel.FullName
          $env:PROMPTMEND_CONSTRAINTS = "$env:GITHUB_WORKSPACE\dist\constraints.txt"
          $script = "$env:GITHUB_WORKSPACE\scripts\install.ps1"
          powershell -NoProfile -ExecutionPolicy ByPass -Command "Get-Content -Raw '$script' | Invoke-Expression"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 rerun exited $LASTEXITCODE" }
          $bin = (uv tool dir --bin).Trim()
          $installed = (& "$bin\promptmend.exe" --version).Trim()
          $expected = $wheel.Name.Split('-')[1]
          if ($installed -ne $expected) { throw "installed $installed, expected $expected" }
          Write-Host "promptmend $installed from $bin"
      # A promptmend running from uv's tool folder (here its Scripts\python.exe, as the open
      # interface holds it) makes the uv channel refuse before uv runs, so the install stays
      # whole (#356).
      - name: Refuse a uv reinstall while promptmend runs
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl" | Select-Object -First 1
          $env:PROMPTMEND_WHEEL = $wheel.FullName
          $env:PROMPTMEND_CONSTRAINTS = "$env:GITHUB_WORKSPACE\dist\constraints.txt"
          $python = Join-Path (uv tool dir).Trim() 'promptmend\Scripts\python.exe'
          $proc = Start-Process -FilePath $python -ArgumentList '-c', '"import time; time.sleep(120)"' -PassThru -WindowStyle Hidden
          try {
            $script = "$env:GITHUB_WORKSPACE\scripts\install.ps1"
            $out = powershell -NoProfile -ExecutionPolicy ByPass -Command "try { Get-Content -Raw '$script' | Invoke-Expression } catch { [Console]::Out.WriteLine(`$_.Exception.Message); exit 1 }" | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -eq 0 -or -not $out.Contains("is running (process $($proc.Id)") -or -not $out.Contains('promptmend was not changed.')) {
              throw "install.ps1 did not refuse while $python ran (exit $code)"
            }
            if ($out.Contains('> uv tool install')) { throw "uv ran before the refusal" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          $bin = (uv tool dir --bin).Trim()
          & "$bin\promptmend.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "promptmend no longer runs after the refusal" }
      # Start-up through uv's promptmend.exe shim, the launcher Espanso runs (#306), in the job
      # summary next to frozen-windows' numbers, with whether Defender's real-time protection
      # was on (as the runner reports it, not assumed). No time is asserted
      # (runner noise); the step fails only when the measurement did not work.
      - name: Time start-up through the uv tool shim
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Continue'
          $bin = (uv tool dir --bin).Trim()
          $exe = "$bin\promptmend.exe"
          # One run, as JSON: the rows' status is checked from it, and the table rendered.
          $json = & $exe doctor --timing --no-clipboard --json --launcher $exe | Out-String
          # doctor exits 4 here (no key, no Espanso); only its timing matters.
          if ($LASTEXITCODE -notin 0, 4) { throw "doctor exited $LASTEXITCODE`n$json" }
          $t = ($json | ConvertFrom-Json).timing
          if (-not $t -or @($t.runs).Count -eq 0) { throw "doctor --timing reported no timing`n$json" }
          try { $defender = [string](Get-MpComputerStatus -ErrorAction Stop).RealTimeProtectionEnabled } catch { $defender = '' }
          if (-not $defender) { $defender = 'unknown' }
          $cell = { param($ms) if ($null -eq $ms) { '-' } else { [string][math]::Round([double]$ms) } }
          $lines = @(
            '### Start-up: uv tool install (`doctor --timing`)',
            '',
            "Against the local stub (no provider call), ms: the first run, then the median of $($t.warm_runs) warm.",
            '',
            "- launcher: ``$(if ($t.launcher) { $t.launcher } else { $t.launcher_note })``",
            "- interpreter: ``$($t.interpreter -join ' ')``",
            "- Defender real-time protection: $defender",
            '',
            '| command | via | cold | warm | status |',
            '| --- | --- | ---: | ---: | --- |'
          )
          foreach ($r in $t.runs) {
            $status = if ($r.message) { "$($r.status): $($r.message)" } else { "$($r.status)" }
            $status = ($status -replace '\|', '\|') -replace '\s*\r?\n\s*', ' '
            $lines += "| ``$($r.command)`` | $($r.via) | $(& $cell $r.cold_ms) | $(& $cell $r.warm_median_ms) | $status |"
          }
          $text = ($lines -join "`n") + "`n`n"
          Write-Host $text
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $text, [Text.UTF8Encoding]::new($false))
          $failed = @($t.runs | Where-Object { $_.status -eq 'failed' })
          if ($failed.Count -gt 0) { throw "$($failed.Count) timing row(s) failed" }
          if (-not $t.launcher -or [IO.Path]::GetFullPath($t.launcher) -ne [IO.Path]::GetFullPath($exe)) {
            throw "the uv shim was not timed; launcher: $($t.launcher), note: $($t.launcher_note)"
          }
          exit 0  # not doctor's 4

  # The frozen Windows build (#185): PyInstaller onedir, zipped as the release does it, then
  # unzipped and run as a user would, with no Python or uv involved: --version, doctor (which
  # must see a frozen build), persona, the same exe reached through a symbolic link in a fake
  # WinGet layout (doctor must report the winget channel and the Links alias), every
  # trigger's real args against the setup check's local stub (exit 0, empty stderr), and
  # `doctor --timing` with the size of `_internal` in the job summary. The zip is kept as an
  # artifact for a few days.
  frozen-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # No request to pypi.org from doctor (#197).
      PROMPT_UPDATE_CHECK: "false"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build the zip
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --locked --group build
          uv run --group build python scripts/build_windows.py build
      - name: Unzip it and run the exe
        working-directory: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\promptmend-*-windows-x64.zip" | Select-Object -First 1
          $version = $zip.Name.Split('-')[1]
          # A fixed place, as docs/install.md says: deploy refuses a temp or versioned folder.
          $root = "$env:LOCALAPPDATA\Programs\promptmend-ci"
          Expand-Archive $zip.FullName -DestinationPath $root
          $exe = "$root\promptmend\promptmend.exe"
          foreach ($data in "_internal", "_internal\promptmend\espanso\match\prompts-llm.yml", "_internal\promptmend\prompts\default.md", "_internal\promptmend\prompts\general.md") {
            if (-not (Test-Path "$root\promptmend\$data")) { throw "the zip lacks $data" }
          }
          $installed = (& $exe --version).Trim()
          if ($installed -ne $version) { throw "the exe says $installed, the zip is $version" }
          $persona = & $exe persona 2> "$env:RUNNER_TEMP\persona-stderr.txt"
          if ((Get-Item "$env:RUNNER_TEMP\persona-stderr.txt").Length -ne 0) { throw "persona wrote to stderr" }
          if ($persona -ne "I am working as [role] in [company].") { throw "persona printed: $persona" }
          # The spec's optimize=1 keeps the docstrings Typer's help is made of.
          $help = (& $exe doctor --help) | Out-String
          if (-not ($help -replace '\s', '').Contains('Safetopasteintoabugreport')) { throw "doctor --help lost its docstring:`n$help" }
          # doctor exits 4 here (no key, no Espanso); only its report matters.
          $PSNativeCommandUseErrorActionPreference = $false
          $report = (& $exe doctor --no-clipboard --json) | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -notin 0, 4) { throw "doctor exited $LASTEXITCODE" }
          $report.checks.cli | ConvertTo-Json -Depth 5
          $report.checks.install | ConvertTo-Json -Depth 5
          if ($report.checks.cli.data.frozen -ne $true) { throw "doctor does not see a frozen build" }
          if ($report.checks.version.data.version -ne $version) { throw "doctor reports another version" }
          if ($report.checks.install.data.channel -ne "script") { throw "an unzipped exe is not the script channel" }
          "FROZEN_EXE=$exe" >> $env:GITHUB_ENV
          exit 0  # not doctor's 4
      # install.ps1's default channel (#185) with this zip (PROMPTMEND_ZIP), run as the
      # one-liner runs it (Windows PowerShell 5.1, `irm | iex`), from a copy rendered with this
      # zip's hash: a fresh install, then a reinstall over it while the promptmend-ci copy runs
      # (an exe from another folder must not block it); the exe must answer from
      # %LOCALAPPDATA%\Programs\promptmend, on the user PATH once, with doctor naming the
      # installer channel, and an unexpanded %USERPROFILE% entry already on the user PATH must
      # stay unexpanded (the value an expandable string). Refused, and nothing changed: a zip
      # whose hash is not the one the copy carries, and any install while a promptmend.exe from
      # that folder runs. The user PATH is restored at the end.
      - name: Install it with install.ps1 (the exe channel)
        working-directory: ${{ runner.temp }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\promptmend-*-windows-x64.zip" | Select-Object -First 1
          $version = $zip.Name.Split('-')[1]
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $dest = "$env:LOCALAPPDATA\Programs\promptmend"
          $exe = "$dest\promptmend.exe"
          if (Test-Path $dest) { throw "$dest exists before the install" }
          function Render([string]$Out, [string]$Zip) {
            uv run --no-project python "$env:GITHUB_WORKSPACE\scripts\render_installer.py" $version $Out --zip $Zip
            if ($LASTEXITCODE -ne 0) { throw "render_installer exited $LASTEXITCODE" }
          }
          # The installer's output in $Log, ending in the message of the error a refusal
          # throws, on one line on stdout (an error record would wrap and go to stderr).
          function Invoke-Installer([string]$Script, [string]$Log) {
            powershell -NoProfile -ExecutionPolicy ByPass -Command "try { Get-Content -Raw '$Script' | Invoke-Expression } catch { [Console]::Out.WriteLine(`$_.Exception.Message); exit 1 }" | Tee-Object -FilePath $Log | Out-Host
            return $LASTEXITCODE
          }
          function Has-Text([string]$Log, [string]$Text) {
            return (Get-Content -Raw $Log).Contains($Text)
          }
          function Stop-Tree($Process) {
            & taskkill.exe /PID $Process.Id /T /F 2>$null | Out-Null
          }

          # The user PATH as it was, then with an unexpanded entry.
          $envKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $hadPath = $envKey.GetValueNames() -contains 'Path'
          $rawPath = $null
          $pathKind = [Microsoft.Win32.RegistryValueKind]::ExpandString
          if ($hadPath) {
            $rawPath = [string]$envKey.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $pathKind = $envKey.GetValueKind('Path')
          }
          $seed = '%USERPROFILE%\ci-x'
          $seeded = if ($rawPath) { "$($rawPath.TrimEnd(';'));$seed" } else { $seed }
          $envKey.SetValue('Path', $seeded, [Microsoft.Win32.RegistryValueKind]::ExpandString)
          try {
            $rendered = "$env:RUNNER_TEMP\install-exe.ps1"
            Render $rendered $zip.FullName
            $env:PROMPTMEND_ZIP = $zip.FullName
            foreach ($run in 'fresh', 'again') {
              $other = $null
              if ($run -eq 'again') {
                # The promptmend-ci copy, running from another folder: no reason to refuse.
                $other = Start-Process -FilePath $env:FROZEN_EXE -ArgumentList 'doctor', '--timing', '--runs', '50', '--no-clipboard' -PassThru -WindowStyle Hidden
                Start-Sleep -Seconds 3
                if ($other.HasExited) { throw "the promptmend-ci doctor --timing ended early (exit $($other.ExitCode))" }
              }
              try {
                $log = "$env:RUNNER_TEMP\install-exe-$run.log"
                $code = Invoke-Installer $rendered $log
                if ($code -ne 0) { throw "install.ps1 ($run) exited $code" }
              } finally {
                if ($other) { Stop-Tree $other }
              }
              if (-not (Has-Text $log "SHA-256: $hash")) { throw "install.ps1 ($run) printed no hash" }
              $installed = (& $exe --version).Trim()
              if ($installed -ne $version) { throw "the installed exe says $installed, the zip is $version" }
            }
            $left = @(Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | Where-Object { $_.Name -match '^promptmend\.(new|old)-' })
            if ($left.Count -ne 0) { throw "install.ps1 left $($left.FullName -join ', ')" }
            $raw = [string]$envKey.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $kind = $envKey.GetValueKind('Path')
            if ($kind -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) { throw "the user PATH is now $kind, not ExpandString" }
            if (@($raw -split ';' | Where-Object { $_ -eq $seed }).Count -ne 1) { throw "the unexpanded $seed entry did not survive: $raw" }
            $entries = @($raw -split ';' | Where-Object { $_ -and $_.TrimEnd('\') -ieq $dest })
            if ($entries.Count -ne 1) { throw "$dest is $($entries.Count) times on the user PATH: $raw" }
            $report = (& $exe doctor --no-clipboard --json) | Out-String | ConvertFrom-Json
            if ($LASTEXITCODE -notin 0, 4) { throw "doctor exited $LASTEXITCODE" }
            $report.checks.install | ConvertTo-Json -Depth 5
            if ($report.checks.install.data.channel -ne 'installer') { throw "doctor does not see the installer channel" }
            if ($report.checks.install.data.launcher -ne $exe) { throw "the launcher is not $exe" }

            # A marker in the installed folder: still there after each refusal below.
            $marker = "$dest\ci-marker.txt"
            Set-Content -LiteralPath $marker -Value 'kept'
            $bad = "$env:RUNNER_TEMP\install-bad-hash.ps1"
            $otherZip = "$env:RUNNER_TEMP\other.zip"
            [IO.File]::WriteAllText($otherZip, 'not this zip')
            Render $bad $otherZip
            $log = "$env:RUNNER_TEMP\install-bad-hash.log"
            $code = Invoke-Installer $bad $log
            if ($code -eq 0) { throw "a zip with another hash was installed" }
            if (-not (Has-Text $log 'nothing was changed')) { throw "the hash refusal did not say so" }
            if (-not (Test-Path $marker)) { throw "the hash refusal changed $dest" }

            # doctor --timing runs for a while, its children from the same folder.
            $busy = Start-Process -FilePath $exe -ArgumentList 'doctor', '--timing', '--runs', '50', '--no-clipboard' -PassThru -WindowStyle Hidden
            try {
              Start-Sleep -Seconds 3
              if ($busy.HasExited) { throw "doctor --timing ended before the check (exit $($busy.ExitCode))" }
              $log = "$env:RUNNER_TEMP\install-busy.log"
              $code = Invoke-Installer $rendered $log
              if ($code -eq 0) { throw "install.ps1 replaced the folder while its exe was running" }
              if (-not (Has-Text $log "promptmend.exe from $dest is running")) { throw "the running refusal did not say so" }
              if (-not (Test-Path $marker)) { throw "the running refusal changed $dest" }
            } finally {
              Stop-Tree $busy
            }
          } finally {
            if ($hadPath) { $envKey.SetValue('Path', $rawPath, $pathKind) } else { $envKey.DeleteValue('Path', $false) }
            $envKey.Close()
          }
          Write-Host "install.ps1 installed promptmend $version into $dest"
          exit 0  # not doctor's 4
      - name: Run it through a WinGet Links alias
        working-directory: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $local = "$env:RUNNER_TEMP\winget-local"
          $package = "$local\Microsoft\WinGet\Packages\vlastimilbures.PromptMend_Microsoft.Winget.Source_8wekyb3d8bbwe"
          New-Item -ItemType Directory -Force -Path $package, "$local\Microsoft\WinGet\Links" | Out-Null
          Copy-Item -Recurse "$env:LOCALAPPDATA\Programs\promptmend-ci\promptmend" $package
          $link = "$local\Microsoft\WinGet\Links\promptmend.exe"
          New-Item -ItemType SymbolicLink -Path $link -Target "$package\promptmend\promptmend.exe" | Out-Null
          & $link --version
          $env:LOCALAPPDATA = $local
          $PSNativeCommandUseErrorActionPreference = $false
          $report = (& $link doctor --no-clipboard --json) | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -notin 0, 4) { throw "doctor exited $LASTEXITCODE" }
          $report.checks.cli | ConvertTo-Json -Depth 5
          $report.checks.install | ConvertTo-Json -Depth 5
          if ($report.checks.install.data.channel -ne "winget") { throw "doctor does not see the winget channel" }
          if ($report.checks.install.data.launcher -ne $link) { throw "the launcher is not the Links alias" }
          exit 0  # not doctor's 4
      - name: Replay every trigger through the exe
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PROMPTMEND_EXE = $env:FROZEN_EXE
          uv run pytest tests/test_triggers.py -k process -p no:cacheprovider
      # The exe is its own launcher, so each command is timed once, and the interface's import
      # is skipped by design. No time is asserted (runner noise); the step fails only when the
      # measurement did not work. #306: the size of _internal goes next to it.
      - name: Time start-up through the exe
        working-directory: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $invariant = [Globalization.CultureInfo]::InvariantCulture
          $files = @(Get-ChildItem -LiteralPath (Join-Path (Split-Path $env:FROZEN_EXE) '_internal') -Recurse -File -Force)
          $mb = ($files | Measure-Object -Property Length -Sum).Sum / 1MB
          # One run, as JSON: the rows' status is checked from it, and the table rendered.
          $json = & $env:FROZEN_EXE doctor --timing --no-clipboard --json | Out-String
          # doctor exits 4 here (no key, no Espanso); only its timing matters.
          if ($LASTEXITCODE -notin 0, 4) { throw "doctor exited $LASTEXITCODE`n$json" }
          $t = ($json | ConvertFrom-Json).timing
          if (-not $t -or @($t.runs).Count -eq 0) { throw "doctor --timing reported no timing`n$json" }
          try { $defender = [string](Get-MpComputerStatus -ErrorAction Stop).RealTimeProtectionEnabled } catch { $defender = '' }
          if (-not $defender) { $defender = 'unknown' }
          $cell = { param($ms) if ($null -eq $ms) { '-' } else { [string][math]::Round([double]$ms) } }
          $lines = @(
            '### Start-up: frozen exe (`doctor --timing`)',
            '',
            "Against the local stub (no provider call), ms: the first run, then the median of $($t.warm_runs) warm.",
            '',
            "- launcher: ``$(if ($t.launcher) { $t.launcher } else { $t.launcher_note })``",
            "- interpreter: ``$($t.interpreter -join ' ')``",
            "- Defender real-time protection: $defender",
            ('- `_internal`: {0} files, {1} MB' -f $files.Count, $mb.ToString('F1', $invariant)),
            '',
            '| command | via | cold | warm | status |',
            '| --- | --- | ---: | ---: | --- |'
          )
          foreach ($r in $t.runs) {
            $status = if ($r.message) { "$($r.status): $($r.message)" } else { "$($r.status)" }
            $status = ($status -replace '\|', '\|') -replace '\s*\r?\n\s*', ' '
            $lines += "| ``$($r.command)`` | $($r.via) | $(& $cell $r.cold_ms) | $(& $cell $r.warm_median_ms) | $status |"
          }
          $text = ($lines -join "`n") + "`n`n"
          Write-Host $text
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $text, [Text.UTF8Encoding]::new($false))
          $failed = @($t.runs | Where-Object { $_.status -eq 'failed' })
          if ($failed.Count -gt 0) { throw "$($failed.Count) timing row(s) failed" }
          if ($files.Count -eq 0) { throw "_internal is empty" }
          exit 0  # not doctor's 4
      # The manifests a release would submit to microsoft/winget-pkgs (by hand, #185),
      # rendered for this zip and checked by the runner's own winget.
      - name: Validate the WinGet manifests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw "this runner has no winget" }
          winget --version
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\promptmend-*-windows-x64.zip" | Select-Object -First 1
          $version = $zip.Name.Split('-')[1]
          uv run python scripts/winget_manifest.py --version $version --zip $zip.FullName -o "$env:RUNNER_TEMP\winget"
          winget validate --manifest "$env:RUNNER_TEMP\winget\manifests\v\vlastimilbures\PromptMend\$version" --disable-interactivity
      # The same manifests, the installer URL pointing at this zip on a loopback server.
      - name: Install, run and uninstall it with winget
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\promptmend-*-windows-x64.zip" | Select-Object -First 1
          $version = $zip.Name.Split('-')[1]
          $port = 8765
          $server = $null
          try {
            $server = Start-Process -PassThru -NoNewWindow -FilePath "$env:GITHUB_WORKSPACE\.venv\Scripts\python.exe" -ArgumentList "-m", "http.server", "$port", "--bind", "127.0.0.1", "--directory", "$env:GITHUB_WORKSPACE\dist"
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (Test-NetConnection 127.0.0.1 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue)) {
              if ((Get-Date) -gt $deadline) { throw "the local server did not start" }
              Start-Sleep -Milliseconds 500
            }
            $out = "$env:RUNNER_TEMP\winget-local-install"
            uv run python scripts/winget_manifest.py --version $version --zip $zip.FullName -o $out --url "http://127.0.0.1:$port/$($zip.Name)"
            $manifest = "$out\manifests\v\vlastimilbures\PromptMend\$version"
            winget settings --enable LocalManifestFiles
            winget settings --enable LocalArchiveMalwareScanOverride
            winget install --manifest $manifest --accept-package-agreements --accept-source-agreements --disable-interactivity --ignore-local-archive-malware-scan
          } finally {
            if ($server) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
          $link = "$env:LOCALAPPDATA\Microsoft\WinGet\Links\promptmend.exe"
          if (-not (Test-Path $link)) { throw "winget made no Links alias" }
          $installed = (& $link --version).Trim()
          if ($installed -ne $version) { throw "the alias says $installed, the zip is $version" }
          $PSNativeCommandUseErrorActionPreference = $false
          $report = (& $link doctor --no-clipboard --json) | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -notin 0, 4) { throw "doctor exited $LASTEXITCODE" }
          $report.checks.install | ConvertTo-Json -Depth 5
          if ($report.checks.install.data.channel -ne "winget") { throw "doctor does not see the winget channel" }
          if ($report.checks.install.data.launcher -ne $link) { throw "the launcher is not the Links alias" }
          $PSNativeCommandUseErrorActionPreference = $true
          winget uninstall --manifest $manifest --accept-source-agreements --disable-interactivity
          if (Test-Path $link) { throw "the Links alias is still there" }
          $left = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter "vlastimilbures.PromptMend_*" -ErrorAction SilentlyContinue
          if ($left) { throw "winget left $($left.FullName)" }
      - name: Keep the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: promptmend-windows-x64
          path: dist/promptmend-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
