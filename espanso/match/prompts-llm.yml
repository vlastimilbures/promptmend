# Each CLI call below is a `type: script` var: Espanso starts the program in args[0]
# directly, with no shell, and passes every other item to it as one argument (after filling
# in {{form1.*}}). So no shell quoting applies; a `type: shell` var would run through
# PowerShell on Windows, which cannot run a quoted path followed by arguments (#18). Keep
# every item a double-quoted string: Espanso drops an item that is not a string.
# The CLI placeholder is replaced with the absolute CLI path by `promptmend espanso deploy`
# (or the install scripts), because GUI-launched Espanso does not inherit shell PATH.
# A script var fails on any stderr output, so the CLI keeps stderr empty. The CLI finds its
# settings on its own (its config folder, an editable checkout's .env, or
# PROMPTMEND_ENV), so no `cd`.
matches:
  # Rewrites the clipboard draft into the golden template (see prompts-template.yml).
  # This is the live cloud trigger: it runs on OpenRouter, so the clipboard
  # leaves the machine. The CLI's redaction gate blocks sensitive content
  # unless ALLOW_CLOUD_OVERRIDE=true, but that gate is a heuristic, not a
  # guarantee — only use this trigger where company policy permits.
  - trigger: "-i-"
    label: "PromptMend: rewrite the clipboard (OpenRouter)"
    left_word: true
    replace: "{{output}}"
    force_mode: clipboard
    vars:
      - name: output
        type: script
        params:
          args: ["__PROMPT_WORKFLOW__", "improve", "--trigger-id", "i", "--provider", "openrouter", "--source", "clipboard"]

  # Same rewrite as -i-, sent once although the gate flagged a confidentiality label, a
  # Vietnamese ID number, an email address or an IBAN. Keys, tokens, passwords, cards and
  # private keys stay blocked. The paste starts with a "[promptmend: sent despite: …]"
  # line. Use it only for a draft whose flagged content may leave the machine.
  - trigger: "-iok-"
    label: "PromptMend: rewrite, allow a flagged label, ID, email or IBAN (OpenRouter)"
    left_word: true
    replace: "{{output}}"
    force_mode: clipboard
    vars:
      - name: output
        type: script
        params:
          args: ["__PROMPT_WORKFLOW__", "improve", "--trigger-id", "iok", "--provider", "openrouter", "--allow-flagged", "--source", "clipboard"]

  # Same rewrite on the pro tier: a reasoning model (OPENROUTER_PRO_MODEL) for hard,
  # multi-part drafts. Slower (about 6 s median, 9 s p95) but more rigorous. Same cloud
  # caveats as above.
  - trigger: "-ip-"
    label: "PromptMend: rewrite on the pro tier (OpenRouter)"
    left_word: true
    replace: "{{output}}"
    force_mode: clipboard
    vars:
      - name: output
        type: script
        params:
          args: ["__PROMPT_WORKFLOW__", "improve", "--trigger-id", "ip", "--provider", "openrouter", "--tier", "pro", "--source", "clipboard"]

  # Same rewrite, but a popup picks the model and its settings for this one call.
  # Built on the pro tier, so "default" in each list means the OPENROUTER_PRO_* setting
  # (for the model: OPENROUTER_PRO_MODEL with its OPENROUTER_PRO_PROVIDER pin).
  # Each model carries its OpenRouter endpoint pin as model@endpoint (@auto = OpenRouter's
  # own routing), since one pin only serves one vendor's models. Every field is a fixed
  # choice, never free text, and each reaches the CLI as one whole argument.
  # Many reasoning models count thinking tokens against the max tokens cap, so pair high
  # effort with 8000+ or the rewrite can come back cut short. Same cloud caveats as above.
  - trigger: "-if-"
    label: "PromptMend: rewrite, pick model and settings (OpenRouter)"
    left_word: true
    replace: "{{output}}"
    force_mode: clipboard
    vars:
      - name: form1
        type: form
        params:
          layout: |
            Model:        [[model]]
            Effort:       [[effort]]
            Max tokens:   [[maxtokens]]
            Timeout (s):  [[timeout]]
          fields:
            model:
              type: choice
              values:
                - default
                - openai/gpt-6-luna@openai
                - openai/gpt-6-luna@auto
                - google/gemini-3.8-flash@google-ai-studio
                - google/gemini-3.5-flash-lite@google-ai-studio/flex
              default: "default"
            effort:
              type: choice
              values: ["default", "none", "minimal", "low", "medium", "high"]
              default: "default"
            maxtokens:
              type: choice
              values: ["default", "2400", "4000", "8000", "16000"]
              default: "default"
            timeout:
              type: choice
              values: ["default", "30", "60", "120"]
              default: "default"
      - name: output
        type: script
        params:
          args: ["__PROMPT_WORKFLOW__", "improve", "--trigger-id", "if", "--provider", "openrouter", "--tier", "pro", "--source", "clipboard", "--model", "{{form1.model}}", "--effort", "{{form1.effort}}", "--max-tokens", "{{form1.maxtokens}}", "--timeout", "{{form1.timeout}}"]

  - trigger: "-il-"
    label: "PromptMend: rewrite locally (Ollama)"
    left_word: true
    replace: "{{output}}"
    force_mode: clipboard
    vars:
      - name: output
        type: script
        params:
          args: ["__PROMPT_WORKFLOW__", "improve", "--trigger-id", "il", "--provider", "ollama", "--profile", "general", "--source", "clipboard"]

  - trigger: "-ilm-"
    label: "PromptMend: rewrite locally (LM Studio)"
    left_word: true
    replace: "{{output}}"
    force_mode: clipboard
    vars:
      - name: output
        type: script
        params:
          args: ["__PROMPT_WORKFLOW__", "improve", "--trigger-id", "ilm", "--provider", "lmstudio", "--profile", "general", "--source", "clipboard"]

  # Claude cloud trigger, disabled by default. It sends clipboard content
  # to the Anthropic API. Uncomment only if company policy permits, and note
  # that the CLI still blocks sensitive content unless ALLOW_CLOUD_OVERRIDE=true.
  # - trigger: "-ic-"
  #   label: "PromptMend: rewrite (Anthropic)"
  #   left_word: true
  #   replace: "{{output}}"
  #   force_mode: clipboard
  #   vars:
  #     - name: output
  #       type: script
  #       params:
  #         args: ["__PROMPT_WORKFLOW__", "improve", "--trigger-id", "ic", "--provider", "anthropic", "--profile", "general", "--source", "clipboard"]

  # OpenAI cloud trigger, disabled by default. It sends clipboard content
  # to the OpenAI API. Uncomment only if company policy permits, and note
  # that the CLI still blocks sensitive content unless ALLOW_CLOUD_OVERRIDE=true.
  # - trigger: "-io-"
  #   label: "PromptMend: rewrite (OpenAI)"
  #   left_word: true
  #   replace: "{{output}}"
  #   force_mode: clipboard
  #   vars:
  #     - name: output
  #       type: script
  #       params:
  #         args: ["__PROMPT_WORKFLOW__", "improve", "--trigger-id", "io", "--provider", "openai", "--source", "clipboard"]
